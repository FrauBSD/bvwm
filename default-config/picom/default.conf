# BSD / fvwm3 picom config (picom v13+ uses rules: for per-window options)
#
# IMPORTANT: for a given option, the *last* matching rule wins. Lock Screen
# (opaque) and Lock Desktop (sheer) rules must come AFTER the generic
# override_redirect catch-all or opacity/dim can flip and leak the session.

shadow = false;
no-dnd-shadow = true;
no-dock-shadow = true;
clear-shadow = true;

# Opacity (inactive dim applied via rules: below)
alpha-step = 0.06;

# Fading: keep engine available for rare per-rule fade=true (e.g. lock
# desktop), but never animate window map/unmap. Open/close fade-in is junk.
fading = true;
no-fading-openclose = true;
fade-delta = 6;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Other
backend = "xrender";
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;
vsync = false;
dbe = false;
paint-on-overlay = true;
sw-opti = false;
unredir-if-possible = false;
detect-transient = false;
detect-client-leader = false;

# Per-window rules (required on picom v13; legacy shadow-exclude is ignored)
rules: ({
  match = "override_redirect = true";
  shadow = false;
  full-shadow = false;
  fade = false;
  opacity = 1.0;
  dim = 0.0;
}, {
  match = "window_type = 'menu'         || "
          "window_type = 'popup_menu'   || "
          "window_type = 'dropdown_menu'";
  shadow = false;
  full-shadow = false;
  opacity = 1.0;
  fade = false;
  dim = 0.0;
  blur-background = false;
}, {
  match = "class_g = 'Fvwm' && override_redirect = true";
  opacity = 1.0;
  fade = false;
  dim = 0.0;
}, {
  match = "window_type = 'tooltip'      || "
          "window_type = 'utility'      || "
          "window_type = 'notification' || "
          "window_type = 'combo'        || "
          "window_type = 'splash'       || "
          "window_type = 'unknown'";
  shadow = false;
  full-shadow = false;
  opacity = 1.0;
  fade = false;
  dim = 0.0;
  blur-background = false;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "name %= 'Conky*'        || "
          "class_g ?= 'Notify-osd' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
  full-shadow = false;
}, {
  match = "name %= 'Conky*' || class_g = 'Conky'";
  focus = false;
}, {
  # Fvwm3 menus/popups: picom types them as normal, no WM_CLASS; must come
  # before the inactive-client rule or they inherit 0.9 opacity.
  match = "window_type = 'normal' && !class_g && border_width = 0";
  opacity = 1.0;
  fade = false;
  dim = 0.0;
  blur-background = false;
}, {
  match = "focused = false && window_type = 'normal' && class_g";
  opacity = 0.9;
}, {
  match = "focused = false && class_i = 'bsd-xterm'";
  opacity = 0.8;
}, {
  # Fullscreen surfaces (video in Brave, mpv): stay opaque when another
  # window takes focus.  Later rules win ("If the same option is set
  # multiple times, the last one will take effect" -- picom(1)), so
  # this must come after the inactive-client rules to override them.
  match = "fullscreen";
  opacity = 1.0;
  dim = 0.0;
}, {
  match = "(class_g = 'Florence' || class_i = 'florence') && width >= 200";
  opacity = 0.95;
  fade = false;
  dim = 0.0;
}, {
  match = "(class_g = 'Florence' || class_i = 'florence') && override_redirect = true";
  opacity = 1.0;
  fade = false;
  dim = 0.0;
}, {
  match = "(class_g = 'Florence' || class_i = 'florence') && width >= 40 && width < 100 && height >= 30 && height < 60";
  opacity = 0.35;
  fade = false;
  dim = 0.0;
}, {
  match = "window_type = 'dock' || window_type = 'desktop'";
  blur-background = false;
}, {
  # --- Lock rules LAST (must win over generic override_redirect) ---
  match = "class_i = 'xlock-backdrop' || class_g = 'xlock-backdrop'";
  shadow = false;
  full-shadow = false;
  fade = false;
  opacity = 1.0;
  dim = 0.0;
}, {
  # Lock Screen (opaque): never allow inactive/override rules to dim this.
  match = "class_i = 'xlock-screen' || class_g = 'xlock-screen'";
  shadow = false;
  full-shadow = false;
  fade = false;
  opacity = 1.0;
  dim = 0.0;
  transparent-clipping = false;
}, {
  # Lock Desktop (sheer): intentional translucency over the live session.
  match = "class_i = 'xlock-desktop' || class_g = 'xlock-desktop'";
  shadow = false;
  full-shadow = false;
  fade = true;
  opacity = 0.9;
  dim = 0.0;
  transparent-clipping = false;
});
